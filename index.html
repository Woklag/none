<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Юля сегодня...</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            color: #000000;
            font-family: sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            overflow: hidden;
        }
        #content {
            font-size: clamp(24px, 5vw, 48px);
            padding: 20px;
            max-width: 90%;
        }
        #test-btn {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 20px;
            font-size: 14px;
            cursor: pointer;
            background: #eee;
            border: 1px solid #ccc;
            border-radius: 5px;
            opacity: 0.5;
        }
        #test-btn:hover {
            opacity: 1;
        }
    </style>
</head>
<body>

<div id="content">Загрузка...</div>
<button id="test-btn" onclick="forceNewWord()">Попробовать другое (тест)</button>

<script>
    // ВСТАВЬТЕ СЮДА АДРЕС ВАШЕГО CLOUDFLARE WORKER
    const WORKER_URL = "https://YOUR-WORKER-URL.workers.dev"; 

    function getMoscowDateKey() {
        const now = new Date();
        const moscowTime = new Date(now.toLocaleString("en-US", {timeZone: "Europe/Moscow"}));
        return moscowTime.toISOString().split('T')[0];
    }

    async function fetchWordFromWorker() {
        try {
            const response = await fetch(WORKER_URL);
            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }
            const data = await response.json();
            return data.word || "...";
        } catch (error) {
            console.error("Ошибка при получении слова от воркера:", error);
            return "...";
        }
    }

    async function init() {
        const dateKey = getMoscowDateKey();
        const storedDate = localStorage.getItem('julia_date');
        const storedWord = localStorage.getItem('julia_word');

        // Если дата совпадает и есть слово в памяти - показываем его
        if (storedDate === dateKey && storedWord && !window.forceMode) {
            document.getElementById('content').innerText = `Юля сегодня ${storedWord}`;
            return;
        }

        // Иначе запрашиваем у воркера
        const newWord = await fetchWordFromWorker();
        
        // Сохраняем только если получили не ошибку
        if (newWord !== "...") {
            localStorage.setItem('julia_date', dateKey);
            localStorage.setItem('julia_word', newWord);
        }
        
        document.getElementById('content').innerText = `Юля сегодня ${newWord}`;
    }

    window.forceNewWord = async function() {
        window.forceMode = true;
        document.getElementById('content').innerText = "Загрузка...";
        const newWord = await fetchWordFromWorker();
        if (newWord !== "...") {
            const dateKey = getMoscowDateKey();
            localStorage.setItem('julia_date', dateKey);
            localStorage.setItem('julia_word', newWord);
        }
        document.getElementById('content').innerText = `Юля сегодня ${newWord}`;
        window.forceMode = false;
    };

    init();
</script>

</body>
</html>
